<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>民呼我为·机考系统</title>
<style>
:root{--blue:#1a5fb4;--red:#c01c28;--green:#2e7d32;--bg:#f5f6f7;--card:#fff;--line:#e0e0e0;--muted:#777}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;background:var(--bg);color:#222;font-size:16px}
.topbar{background:var(--blue);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.topbar h1{font-size:18px;cursor:pointer}
.topbar .navbtn{background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:14px}
.topbar .navbtn:hover{background:rgba(255,255,255,.3)}
.topbar .timer{margin-left:auto;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.topbar .timer.danger{color:#ffb3b3;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.5}}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.btn{display:inline-block;background:var(--blue);color:#fff;border:none;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:15px;margin:4px 4px 4px 0}
.btn:hover{opacity:.9}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn.danger{background:var(--red)}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.setcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
.setcard h3{font-size:15px;margin-bottom:6px}
.setcard .meta{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:#e8f0fe;color:var(--blue);margin-left:6px}
.qcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.qcard .qhead{font-size:13px;color:var(--muted);margin-bottom:4px}

.opt{display:block;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer;line-height:1.6}
.opt:hover{border-color:var(--blue)}
.opt.sel{background:#e8f0fe;border-color:var(--blue);font-weight:600}
.opt.right{background:#e6f4ea;border-color:var(--green)}
.opt.wrong{background:#fdecea;border-color:var(--red)}
.opt.miss{background:#fff8e1;border-color:#f9a825}
.judgebtn{display:inline-block;width:64px;padding:8px 0;text-align:center;border:1px solid var(--line);border-radius:8px;margin-right:10px;cursor:pointer;font-size:18px}
.judgebtn.sel{background:#e8f0fe;border-color:var(--blue);font-weight:700}
.blankinput{border:none;border-bottom:2px solid var(--blue);background:#f8faff;min-width:120px;padding:2px 6px;font-size:15px;text-align:center}
.blankinput:focus{outline:none;border-bottom-color:var(--red)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.navgrid button{padding:6px 0;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:13px}
.navgrid button.done{background:var(--blue);color:#fff;border-color:var(--blue)}
.navgrid button.cur{outline:2px solid var(--red)}
.scorebig{font-size:44px;font-weight:800;color:var(--blue);text-align:center}
.subscore{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:10px 0;color:#444;font-size:14px}
.diff{font-size:13.5px;background:#fafafa;border-radius:8px;padding:8px 10px;margin-top:8px;line-height:1.7}
.diff .u{color:var(--red)} .diff .r{color:var(--green)}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filterbar button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 14px;cursor:pointer;font-size:13px;margin-right:6px}
.filterbar button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:99;max-width:90%}
table.rec{width:100%;border-collapse:collapse;font-size:14px}
table.rec th,table.rec td{border:1px solid var(--line);padding:6px 8px;text-align:center}
table.rec th{background:#f0f4fa}
@media print{
  .topbar,.btn,.filterbar,.noprint{display:none!important}
  body{background:#fff}
  .qcard,.card{break-inside:avoid;border:1px solid #999}
}
.gate{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center}
.gatebox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:32px;width:320px;text-align:center}
.gatebox h2{margin-bottom:16px;font-size:18px}
.gatebox input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:15px;margin-bottom:12px;text-align:center}
.gatebox .err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
@media(max-width:600px){.wrap{padding:10px}.qcard{padding:12px}}
</style>
</head>

const GATE_HASH = 387546929;  // null=关闭门禁
function djb2(s){ let h=5381; for(let i=0;i<s.length;i++){ h=((h*33)^s.charCodeAt(i))&0x7fffffff; } return h; }
function tryGate(){
  const v = document.getElementById('gateInput').value;
  if(djb2(v)===GATE_HASH){
    LS.set('auth', GATE_HASH);
    document.getElementById('gate').style.display='none';
    renderHome();
  }else{
    document.getElementById('gateErr').textContent='口令不对，再试一次';
    document.getElementById('gateInput').value='';
  }
}
const SECTIONS = [['dan','一、单项选择题（每题1分，共30分）'],
                  ['duo','二、多项选择题（每题2分，共20分；错选/漏选均不得分）'],
                  ['pan','三、判断题（每题1分，共20分）'],
                  ['tian','四、填空题（每题2分，共30分；逐字比对）']];
const QMAP = {};
DATA.sets.forEach(s => s.questions.forEach(q => QMAP[q.id] = q));

/* ---------- 存储 ---------- */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('mhww_'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k, v){ localStorage.setItem('mhww_'+k, JSON.stringify(v)); },
  del(k){ localStorage.removeItem('mhww_'+k); }
};
const getRecords = () => LS.get('records', []);
const getBook = () => LS.get('wrongbook', {});
const saveBook = b => LS.set('wrongbook', b);

/* ---------- 工具 ---------- */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtTime = s => String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const fmtDate = ts => { const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
function toast(msg, ms=2600){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const d=document.createElement('div'); d.className='toast'; d.textContent=msg;
  document.body.appendChild(d); setTimeout(()=>d.remove(), ms);
}
function ansText(q, a){
  if(a===undefined||a===null||a==='') return '（未作答）';
  if(q.t==='tian') return Array.isArray(a)? a.map(x=>x===''?'（空）':x).join('；') : a;
  return a;
}
function correctText(q){
  if(q.t==='tian') return q.ans.join('；');
  return q.ans;
}

/* ---------- 全局考试状态 ---------- */
let exam = null;   // {mode:'exam'|'practice', setId?, qids, title, answers, start, duration?, timerId}
let result = null; // 最近一次判分结果

window.addEventListener('beforeunload', e=>{ if(exam){ e.preventDefault(); e.returnValue=''; } });

function go(view, arg){
  if(exam && view!=='exam'){ if(!confirm('考试进行中，离开将保留草稿，确定？')) return; stopTimer(); }
  exam = view==='exam' ? exam : null;
  document.getElementById('timer').style.display =
    (view==='exam' && exam && exam.mode==='exam') ? '' : 'none';
  if(view==='home') renderHome();
  else if(view==='wrong') renderWrong();
  else if(view==='review') renderReview(arg);
  else if(view==='exam') renderExam();
  window.scrollTo(0,0);
}

/* ================= 首页 ================= */
function renderHome(){
  const recs = getRecords(), book = getBook();
  const best = {}, last = {};
  recs.forEach(r=>{ if(r.mode!=='exam')return;
    if(!best[r.setId]||r.score>best[r.setId]) best[r.setId]=r.score;
    last[r.setId]=r.score; });
  const draft = LS.get('draft', null);
  let html = '<div class="card"><b>使用说明</b>：选择一套卷开始考试（60分钟倒计时，交卷立即出分）；'
    + '多选/填空严格判分（全对才得分）。错题自动进入错题本，可重练、可打印。数据保存在本浏览器，支持导出/导入。</div>';
  if(draft){
    html += `<div class="card" style="border-color:#f9a825">⏸ 检测到未完成的考试：<b>${esc(draft.title)}</b>（已答 ${Object.keys(draft.answers).length} 题）
      <button class="btn" onclick="resumeDraft()">继续考试</button>
      <button class="btn ghost" onclick="dropDraft()">放弃草稿</button></div>`;
  }
  html += '<div class="setgrid">';
  DATA.sets.forEach(s=>{
    const b = best[s.id]!==undefined?`最高 <b>${best[s.id]}</b> 分`:'未做过';
    const l = last[s.id]!==undefined?` · 最近 ${last[s.id]} 分`:'';
    const tag = s.kind==='formal'?'<span class="tag">正卷</span>':s.kind==='backup'?'<span class="tag">备用</span>':'<span class="tag">模拟</span>';
    html += `<div class="setcard"><h3>${esc(s.name)}${tag}</h3>
      <div class="meta">75题 · 100分 · 60分钟<br>${b}${l}</div>
      <button class="btn small" onclick="startExam(${s.id})">开始考试</button>
      <button class="btn small ghost" onclick="go('review',${s.id})">背题</button></div>`;
  });
  html += '</div>';
  html += `<div class="card noprint"><b>数据管理</b>：
    <button class="btn ghost small" onclick="exportData()">导出成绩+错题本</button>
    <button class="btn ghost small" onclick="document.getElementById('imp').click()">导入</button>
    <input type="file" id="imp" accept=".json" style="display:none" onchange="importData(this)">
    <span class="muted">换设备/换浏览器时先导出再导入</span></div>`;
  document.getElementById('app').innerHTML = html;
  refreshWrongCnt();
}
function refreshWrongCnt(){
  const n = Object.keys(getBook()).length;
  const el = document.getElementById('wrongCnt');
  if(el) el.textContent = n?`(${n})`:'';
}
function dropDraft(){ LS.del('draft'); renderHome(); }
function resumeDraft(){
  const d = LS.get('draft', null); if(!d) return;
  exam = d; startTimer(); go('exam');
}

/* ================= 考试 ================= */
function startExam(setId){
  const s = DATA.sets[setId];
  exam = { mode:'exam', setId, title:s.name, qids:s.questions.map(q=>q.id), answers:{}, start:Date.now(), duration:3600 };
  startTimer(); go('exam');
}
function startPractice(qids){
  exam = { mode:'practice', title:'错题重练（'+qids.length+'题）', qids, answers:{}, start:Date.now() };
  go('exam');
}
function startTimer(){
  stopTimer();
  const el = document.getElementById('timer');
  if(exam.mode!=='exam'){ el.style.display='none'; return; }
  el.style.display='';
  const tick = ()=>{
    const left = exam.duration - Math.floor((Date.now()-exam.start)/1000);
    if(left<=0){ el.textContent='00:00'; stopTimer(); finishExam(true); return; }
    el.textContent = '⏱ '+fmtTime(left);
    el.classList.toggle('danger', left<300);
  };
  tick(); exam.timerId = setInterval(tick, 1000);
}
function stopTimer(){ if(exam && exam.timerId){ clearInterval(exam.timerId); exam.timerId=null; } }
function persistDraft(){ if(exam && exam.mode==='exam') LS.set('draft', exam); }

function examSections(qs){
  const secs = [];
  SECTIONS.forEach(([t, label])=>{
    const g = qs.filter(q=>q.t===t);
    if(g.length) secs.push({t, label, g});
  });
  return secs;
}

function renderExam(){
  // 题号按本套位置重新编号（QMAP中的no会被其他套覆盖，不可用）
  const qs = exam.qids.map((id,i)=>Object.assign({}, QMAP[id], {no:i+1}));
  const secs = examSections(qs);
  let html = `<div class="card"><b>${esc(exam.title)}</b>
    <span class="muted">　已答 <b id="doneCnt">0</b>/${qs.length} 题</span>
    <div style="float:right"><button class="btn danger" onclick="tryFinish()">交卷</button></div>
    <div style="clear:both"></div></div>`;
  html += '<div class="card"><div class="navgrid" id="navgrid">' +
    qs.map((q,i)=>`<button id="nav${q.no}" onclick="document.getElementById('q${q.no}').scrollIntoView({block:'center'})">${q.no}</button>`).join('') +
    '</div></div>';
  secs.forEach(sec=>{
    html += `<div class="card"><b>${sec.label}</b></div>`;
    sec.g.forEach(q=>{
      html += `<div class="qcard" id="q${q.no}"><div class="qhead">第${q.no}题 · ${q.typeLabel}</div>`;
      if(q.t==='tian'){
        html += '<div class="stem">'+renderBlanks(q)+'</div>';
      }else{
        html += `<div class="stem">${esc(q.stem)}</div>`;
        if(q.t==='dan'||q.t==='duo'){
          ['A','B','C','D'].forEach(L=>{
            html += `<span class="opt" id="op_${q.id}_${L}" onclick="clickOpt('${q.id}','${L}',${q.t==='duo'})"><b>${L}.</b> ${esc(q.opts[L])}</span>`;
          });
        }else if(q.t==='pan'){
          html += `<span class="judgebtn" id="op_${q.id}_T" onclick="clickJudge('${q.id}','√')">√</span>
                   <span class="judgebtn" id="op_${q.id}_F" onclick="clickJudge('${q.id}','×')">×</span>`;
        }
      }
      html += '</div>';
    });
  });
  html += '<div class="card" style="text-align:center"><button class="btn danger" onclick="tryFinish()">交卷</button></div>';
  document.getElementById('app').innerHTML = html;
  // 恢复答案
  Object.entries(exam.answers).forEach(([qid,a])=>{
    const q = QMAP[qid];
    if(q.t==='dan'){ const el=document.getElementById(`op_${qid}_${a}`); if(el) el.classList.add('sel'); }
    else if(q.t==='duo'){ a.forEach(L=>{ const el=document.getElementById(`op_${qid}_${L}`); if(el) el.classList.add('sel'); }); }
    else if(q.t==='pan'){ const el=document.getElementById(`op_${qid}_${a==='√'?'T':'F'}`); if(el) el.classList.add('sel'); }
    else if(q.t==='tian'){ a.forEach((v,i)=>{ const el=document.getElementById(`bk_${qid}_${i}`); if(el) el.value=v; }); }
  });
  updateDone();
}
function renderBlanks(q){
  const parts = q.stem.split(/（[　\s]*）/);
  let html = '';
  parts.forEach((p,i)=>{
    html += esc(p);
    if(i < q.blanks) html += `<input class="blankinput" id="bk_${q.id}_${i}" oninput="fillBlank('${q.id}')" placeholder="第${i+1}空">`;
  });
  return html;
}
function clickOpt(qid, L, multi){
  const cur = exam.answers[qid];
  if(multi){
    let arr = cur? [...cur] : [];
    arr = arr.includes(L)? arr.filter(x=>x!==L) : [...arr, L];
    arr.sort();
    if(arr.length) exam.answers[qid]=arr; else delete exam.answers[qid];
    document.getElementById(`op_${qid}_${L}`).classList.toggle('sel', arr.includes(L));
  }else{
    ['A','B','C','D'].forEach(x=>document.getElementById(`op_${qid}_${x}`).classList.remove('sel'));
    document.getElementById(`op_${qid}_${L}`).classList.add('sel');
    exam.answers[qid]=L;
  }
  persistDraft(); updateDone();
}
function clickJudge(qid, v){
  ['T','F'].forEach(x=>document.getElementById(`op_${qid}_${x}`).classList.remove('sel'));
  document.getElementById(`op_${qid}_${v==='√'?'T':'F'}`).classList.add('sel');
  exam.answers[qid]=v;
  persistDraft(); updateDone();
}
function fillBlank(qid){
  const q = QMAP[qid];
  const vals = [];
  for(let i=0;i<q.blanks;i++) vals.push(document.getElementById(`bk_${qid}_${i}`).value);
  if(vals.some(v=>v.trim()!=='')) exam.answers[qid]=vals; else delete exam.answers[qid];
  persistDraft(); updateDone();
}
function updateDone(){
  const n = Object.keys(exam.answers).length;
  const dc = document.getElementById('doneCnt'); if(dc) dc.textContent=n;
  exam.qids.forEach((id,idx)=>{
    const nb = document.getElementById('nav'+(idx+1));
    if(nb) nb.classList.toggle('done', exam.answers[id]!==undefined);
  });
}
function tryFinish(){
  const un = exam.qids.length - Object.keys(exam.answers).length;
  if(un>0 && !confirm(`还有 ${un} 题未作答，确定交卷？`)) return;
  finishExam(false);
}

/* ---------- 判分（严格模式） ---------- */
function gradeOne(q, a){
  if(a===undefined) return 0;
  if(q.t==='dan') return a===q.ans ? 1 : 0;
  if(q.t==='pan') return a===q.ans ? 1 : 0;
  if(q.t==='duo') return (Array.isArray(a) && a.join('')===q.ans) ? 2 : 0;
  if(q.t==='tian'){
    if(!Array.isArray(a)) return 0;
    for(let i=0;i<q.blanks;i++){
      if((a[i]||'').trim() !== (q.ans[i]||'').trim()) return 0;
    }
    return 2;
  }
  return 0;
}
function finishExam(auto){
  stopTimer();
  document.getElementById('timer').style.display='none';
  if(auto) toast('时间到，自动交卷');
  const qs = exam.qids.map((id,i)=>Object.assign({}, QMAP[id], {no:i+1}));
  let score = 0; const per = [];
  const secScore = {dan:0,duo:0,pan:0,tian:0};
  const book = getBook(); const mastered = [];
  qs.forEach(q=>{
    const a = exam.answers[q.id];
    const got = gradeOne(q, a);
    score += got; secScore[q.t]+=got;
    const max = (q.t==='duo'||q.t==='tian')?2:1;
    per.push({q, a, got, max});
    if(got<max){
      const e = book[q.id]||{count:0, streak:0};
      book[q.id] = {qid:q.id, count:e.count+1, streak:0, lastWrong:Date.now(),
                    lastAns:ansText(q,a), setName:exam.title};
    }else if(book[q.id]){
      book[q.id].streak++;
      if(book[q.id].streak>=2){ delete book[q.id]; mastered.push(q.id); }
    }
  });
  saveBook(book);
  if(exam.mode==='exam'){
    const recs = getRecords();
    recs.push({setId:exam.setId, mode:'exam', score, date:Date.now(),
               usedSec:Math.floor((Date.now()-exam.start)/1000)});
    LS.set('records', recs);
    LS.del('draft');
  }
  if(mastered.length) toast(`🎉 ${mastered.length} 道错题连续答对2次，已自动移出错题本`);
  result = { per, score, secScore, title:exam.title, mode:exam.mode, total:qs.length };
  const wasExam = exam.mode==='exam';
  exam = null;
  renderResult(wasExam);
}

/* ================= 结果页 ================= */
function renderResult(wasExam){
  const r = result;
  const wrong = r.per.filter(p=>p.got<p.max);
  const head = wasExam
    ? `<div class="scorebig">${r.score}<span style="font-size:18px;color:#888"> / 100</span></div>
       <div class="subscore"><span>单选 ${r.secScore.dan}/30</span><span>多选 ${r.secScore.duo}/20</span>
       <span>判断 ${r.secScore.pan}/20</span><span>填空 ${r.secScore.tian}/30</span></div>`
    : `<div class="scorebig">${r.per.filter(p=>p.got===p.max).length}<span style="font-size:18px;color:#888"> / ${r.total} 题</span></div>`;
  let html = `<div class="card">${head}
    <div style="text-align:center;margin-top:8px">
      <button class="btn" onclick="go('home')">回首页</button>
      <button class="btn ghost" onclick="go('wrong')">看错题本</button>
    </div></div>`;
  html += `<div class="card"><b>${esc(r.title)}</b>　错 <b style="color:var(--red)">${wrong.length}</b> 题（已自动收入错题本）</div>`;
  wrong.forEach(p=>{
    const q = p.q;
    let body = `<div class="qhead">第${q.no}题 · ${q.typeLabel} · ${q.cat}</div><div class="stem">${esc(q.stem)}</div>`;
    if(q.t==='dan'||q.t==='duo'){
      ['A','B','C','D'].forEach(L=>{
        let cls='opt';
        const inU = q.t==='dan'? p.a===L : (Array.isArray(p.a)&&p.a.includes(L));
        const inR = q.ans.includes(L);
        if(inR) cls+=' right'; else if(inU) cls+=' wrong';
        body += `<span class="${cls}"><b>${L}.</b> ${esc(q.opts[L])}</span>`;
      });
      body += `<div class="diff">你的答案：<span class="u">${esc(ansText(q,p.a))}</span>　正确答案：<span class="r">${q.ans}</span></div>`;
    }else if(q.t==='pan'){
      body += `<div class="diff">你的答案：<span class="u">${esc(ansText(q,p.a))}</span>　正确答案：<span class="r">${q.ans}</span></div>`;
    }else{
      const ua = Array.isArray(p.a)?p.a:[];
      for(let i=0;i<q.blanks;i++){
        body += `<div class="diff">第${i+1}空 你的：<span class="u">${esc((ua[i]||'').trim()||'（空）')}</span>　正确：<span class="r">${esc(q.ans[i])}</span></div>`;
      }
    }
    html += `<div class="qcard">${body}</div>`;
  });
  if(!wrong.length) html += '<div class="card" style="text-align:center;font-size:20px">🎉 全对！</div>';
  document.getElementById('app').innerHTML = html;
  window.scrollTo(0,0);
}

/* ================= 错题本 ================= */
let wrongFilter = 'all';
function renderWrong(){
  const book = getBook();
  const ids = Object.keys(book);
  const types = ['all','dan','duo','pan','tian'];
  const tLabel = {all:'全部',dan:'单选',duo:'多选',pan:'判断',tian:'填空'};
  let html = `<div class="card"><b>错题本</b>（共 ${ids.length} 题）
    <div style="float:right" class="noprint">
      <button class="btn small" ${ids.length?'':'disabled'} onclick="startPractice(Object.keys(getBook()))">错题重练</button>
      <button class="btn ghost small" onclick="window.print()">打印</button>
    </div><div style="clear:both"></div>
    <div class="muted">规则：答错自动收录；同一题连续答对2次自动移出（重练或正考都计入）。</div>
    <div class="filterbar" style="margin-top:8px">` +
    types.map(t=>{
      const n = t==='all'?ids.length:ids.filter(id=>QMAP[id].t===t).length;
      return `<button class="${wrongFilter===t?'on':''}" onclick="wrongFilter='${t}';renderWrong()">${tLabel[t]} ${n}</button>`;
    }).join('') + '</div></div>';
  const show = ids.filter(id=>wrongFilter==='all'||QMAP[id].t===wrongFilter)
                  .sort((a,b)=>book[b].lastWrong-book[a].lastWrong);
  if(!show.length){ html += '<div class="card" style="text-align:center">🎉 没有错题，继续保持！</div>'; }
  show.forEach(id=>{
    const q = QMAP[id], e = book[id];
    let body = `<div class="qhead">${q.typeLabel} · ${q.cat} · 错 ${e.count} 次 · 最近 ${fmtDate(e.lastWrong)}</div>
      <div class="stem">${esc(q.stem)}</div>`;
    if(q.t==='dan'||q.t==='duo'){
      ['A','B','C','D'].forEach(L=>{
        body += `<span class="opt ${q.ans.includes(L)?'right':''}"><b>${L}.</b> ${esc(q.opts[L])}</span>`;
      });
    }
    body += `<div class="diff">上次你的答案：<span class="u">${esc(e.lastAns)}</span>　正确答案：<span class="r">${esc(correctText(q))}</span>
      <span class="noprint" style="float:right"><button class="btn small ghost" onclick="startPractice(['${id}'])">重练这题</button>
      <button class="btn small ghost" onclick="removeWrong('${id}')">移出</button></span></div>`;
    html += `<div class="qcard">${body}</div>`;
  });
  document.getElementById('app').innerHTML = html;
}
function removeWrong(id){
  const b = getBook(); delete b[id]; saveBook(b);
  renderWrong(); refreshWrongCnt(); toast('已移出错题本');
}

/* ================= 背题 ================= */
function renderReview(setId){
  if(setId===undefined||setId===null) setId = 0;
  const s = DATA.sets[setId];
  let html = `<div class="card noprint"><b>背题模式</b>　
    <select id="rvset" onchange="renderReview(this.value)">` +
    DATA.sets.map(x=>`<option value="${x.id}" ${x.id==setId?'selected':''}>${esc(x.name)}</option>`).join('') +
    `</select> <button class="btn ghost small" onclick="window.print()">打印本套</button></div>`;
  examSections(s.questions).forEach(sec=>{
    html += `<div class="card"><b>${sec.label}</b></div>`;
    sec.g.forEach(q=>{
      let body = `<div class="qhead">第${q.no}题 · ${q.cat}</div><div class="stem">${esc(q.stem)}</div>`;
      if(q.t==='dan'||q.t==='duo'){
        ['A','B','C','D'].forEach(L=>{
          body += `<span class="opt ${q.ans.includes(L)?'right':''}"><b>${L}.</b> ${esc(q.opts[L])}</span>`;
        });
      }
      body += `<div class="diff">答案：<span class="r">${esc(correctText(q))}</span></div>`;
      html += `<div class="qcard">${body}</div>`;
    });
  });
  document.getElementById('app').innerHTML = html;
}

/* ================= 导入导出 ================= */
function exportData(){
  const data = { records:getRecords(), wrongbook:getBook(), exportedAt:Date.now() };
  const blob = new Blob([JSON.stringify(data,null,1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '机考数据_'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('已导出，把文件传到另一台设备后用「导入」即可');
}
function importData(input){
  const f = input.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    try{
      const d = JSON.parse(rd.result);
      if(d.records) LS.set('records', d.records);
      if(d.wrongbook) LS.set('wrongbook', d.wrongbook);
      toast('导入成功'); renderHome();
    }catch(e){ toast('导入失败：文件格式不对'); }
  };
  rd.readAsText(f);
}

// 门禁：开启时先验证，通过后进入首页
if(GATE_HASH===null || LS.get('auth',0)===GATE_HASH){
  renderHome();
}else{
  document.getElementById('gate').style.display='flex';
  document.getElementById('gateInput').addEventListener('keydown',e=>{ if(e.key==='Enter') tryGate(); });
  document.getElementById('gateInput').focus();
}
